title = SolarQuant Anomaly Detection
desc = Forward datum to a SolarQuant anomaly detection service and post prediction results back to SolarNetwork.

status.key = Status
status.desc = Current service status.

containerImage.key = Docker Image
containerImage.desc = Docker image to pull and run, for example <code>ghcr.io/ecosuite/solar-predictor:latest</code>. \
	Leave empty to connect to an existing service at the configured Service URL.

serviceUrl.key = Service URL
serviceUrl.desc = The base URL of the SolarQuant anomaly detection HTTP service, for example <code>http://localhost:8000</code>. \
	When a Docker Image is configured this is set automatically.

sourceIdRegexValue.key = Source ID Filter
sourceIdRegexValue.desc = A case-insensitive regular expression to match the source IDs of datums to forward to the service. \
	Only matching datums will be sent. For example <code>(/INV/|/PYR/)</code>.

uploadSourceId.key = Upload Source ID
uploadSourceId.desc = Base source ID to use for prediction datums uploaded to SolarNetwork. Each prediction's \
	<code>sourceIndex</code> metadata value is appended after a <code>/</code> character. For example \
	<code>/solarquant</code> resolves to <code>/solarquant/1</code>, <code>/solarquant/2</code>, and so on. \
	Leave empty to discard all prediction datums.

flushIntervalSecs.key = Flush Interval
flushIntervalSecs.desc = The interval, in seconds, at which buffered datums are sent to the \
	SolarQuant service.

dockerCommand.key = Docker Command
dockerCommand.desc = Path to the SolarQuant Docker management script.

httpRequestCustomizerUid.key = HTTP Customizer
httpRequestCustomizerUid.desc = The <b>Service Name</b> of the HTTP Request Customizer component to \
	apply to outbound requests (for example, to add authentication). Leave empty for no customization.

manualNodeIdValue.key = Manual Node ID
manualNodeIdValue.desc = The node ID to use when forwarding datum to the service, instead of SolarNode's actual node ID.

sourceMappings.key = Source ID Mappings
sourceMappings.desc = A list of search/replace patterns to apply to datum source IDs before forwarding datum \
	to the service.

sourceMappingsItem.searchValue.key = Source Match
sourceMappingsItem.searchValue.desc = The datum source ID pattern to replace. Capture groups can be referenced in <b>Replacement</b>.

sourceMappingsItem.replace.key = Replacement
sourceMappingsItem.replace.desc = The source ID replacement template to use when <b>Source Match</b> \
	matches a datum source ID. The template can use a <code>{s}</code> parameter which will be \
	replaced by the original source ID, and any capture groups will be available as numbered parameters \
	starting from <code>{1}</code>. For example, a Source Match <code>/x/(\d+)</code> with Replacement \
	<code>/y/{1}</code> would map an input source ID <code>/x/123</code> to <code>/y/123</code>.
